databaseChangeLog:
  - changeSet:
      id: 010-1
      author: mikesajak
      changes:
        - createTable:
            tableName: import_session
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: total_files
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: processed_files
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: failed_files
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: expiry_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 010-2
      author: mikesajak
      changes:
        - addColumn:
            tableName: staged_ebook_upload
            columns:
              - column:
                  name: import_session_id
                  type: UUID
              - column:
                  name: resolution_item_id
                  type: UUID
        - addForeignKeyConstraint:
            baseTableName: staged_ebook_upload
            baseColumnNames: import_session_id
            constraintName: fk_staged_upload_import_session
            referencedTableName: import_session
            referencedColumnNames: id
