server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ebooklib_db}
    username: ebooklib_user
    password: ebooklib_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # For development, automatically update schema
    properties:
      hibernate:
        default_schema: ${db.schema}
  liquibase:
    contexts: schema,default-user,test-data
    default-schema: ${db.schema}
    liquibase-schema: public

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: ebook-library-files

preliquibase:
  enabled: false

app:
  request-logging:
    log-headers: true

